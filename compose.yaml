services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      BDT_ENV: development
      BDT_DATABASE_URL: sqlite:////app/data/bdt.db
      BDT_DATA_DIR: /app/data
      BDT_PUBLIC_ORIGIN: http://localhost:8000
      BDT_ALLOWED_HOSTS: localhost,127.0.0.1
      BDT_ALLOW_REGISTRATION: "0"
    volumes: ["bdt-data:/app/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    restart: unless-stopped
volumes:
  bdt-data:
