services:
  app:
    build: .
    ports: ["127.0.0.1:${BDT_PORT:-8008}:8000"]
    environment:
      BDT_ENV: development
      BDT_DATABASE_URL: sqlite:////app/data/bdt.db
      BDT_DATA_DIR: /app/data
      BDT_PUBLIC_ORIGIN: ${BDT_PUBLIC_ORIGIN:-http://127.0.0.1:8008,http://localhost:8008}
      BDT_ALLOWED_HOSTS: localhost,127.0.0.1
      BDT_ALLOW_REGISTRATION: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes: ["bdt-data:/app/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    restart: unless-stopped
volumes:
  bdt-data:
