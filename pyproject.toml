[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brasildetodos"
version = "0.1.0"
description = "Open civic maps, traceable public data and moderated collaboration"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.35.0",
  "SQLAlchemy==2.0.50",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "pdfplumber==0.11.9",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-cov==6.2.1", "reportlab==4.4.3"]
postgres = ["psycopg[binary]==3.2.10"]

[project.scripts]
bdt = "bdt.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
