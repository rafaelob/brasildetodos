name: Reproducible web dependency lock
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/dependency-lock.yml]
permissions:
  contents: write
concurrency:
  group: dependency-lock-main
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate from the declared manifest and verify
        run: |
          git hash-object web/package.json > "$RUNNER_TEMP/manifest.sha"
          cd web
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm test
          npm run build
          npm audit --audit-level=high
          cp package-lock.json "$RUNNER_TEMP/verified-package-lock.json"
      - name: Publish only the verified lock when the manifest still matches
        run: |
          git fetch origin main
          git merge --ff-only origin/main
          test "$(git hash-object web/package.json)" = "$(cat "$RUNNER_TEMP/manifest.sha")"
          cp "$RUNNER_TEMP/verified-package-lock.json" web/package-lock.json
          git add web/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --signoff -m 'build: lock verified web dependency graph on main'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-web-lock
          retention-days: 7
          path: web/package-lock.json
# GITHUB_TOKEN-authored commits do not start recursive workflows. Quality must
# still be checked for the resulting main revision; this job tests the lock too.
