name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=source.zip HEAD && git rev-parse HEAD > revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          retention-days: 7
          path: |
            source.zip
            revision.txt
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Verify exact Python runtime and configuration
        run: python ops/check_toolchain.py --runtime python
      - run: python ops/install_locked.py --editable
      - run: python -m pytest --cov=bdt --cov-report=xml --cov-report=term --cov-fail-under=85 --junitxml=test-results/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: |
            test-results/
            coverage.xml
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify exact Node runtime
        run: node ../ops/check-node.mjs
      - name: Install the verified web lock
        run: npm ci
      - name: Dependency diagnostic
        run: npm audit --json > npm-audit.json || true
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-build
          path: |
            web/dist/
            web/package-lock.json
            web/npm-audit.json
  browser:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Verify exact Python runtime and configuration
        run: python ops/check_toolchain.py --runtime python
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web
      - run: python ops/install_locked.py --editable && python -m pip install playwright==1.56.0
      - run: python ops/browser_smoke.py
      - name: Exercise documents, independent review, withdrawal and account deletion
        run: python ops/browser_extended.py
      - name: Exercise resource filtering, immutable versions and monetary precision
        run: python ops/browser_resources.py
      - name: Exercise public sharing, versioned export and exact amounts
        run: python ops/browser_resource_sharing.py
      - name: Exercise import state and bounded collection downloads
        run: python ops/browser_resource_status.py
      - name: Exercise optional WebGL map and bundled worker without external data
        run: python ops/browser_map.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/browser/
            test-results/browser-extended/
            test-results/browser-resources/
            test-results/browser-sharing/
            test-results/browser-resource-status/
            test-results/browser-map/
  official-source-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Verify exact Python runtime and configuration
        run: python ops/check_toolchain.py --runtime python
      - run: python -m pip install -e .
      - name: Inspect bounded official responses (not a national CNES load)
        run: python ops/probe_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-evidence
          path: source-probe.json
