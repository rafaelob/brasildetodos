name: Combined public resource release
on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: Published release containing the hash-pinned catalog and resources
        default: 'public-data-20260906-v1'
        required: true
  push:
    branches: [main]
    # Critical paths only (fleet-machine-hub#248): API contracts, exact-money handling, schema
    # and the Python dependency manifests it installs.
    paths:
      - backend/bdt/api.py
      - backend/bdt/domain.py
      - backend/bdt/resource_routes.py
      - backend/bdt/resource_money.py
      - backend/bdt/storage.py
      - pyproject.toml
      - requirements/**
      - .python-version
permissions:
  contents: read
concurrency:
  group: combined-resource-release-main
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag || 'public-data-20260906-v1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Verify exact Python runtime and configuration
        run: python ops/check_toolchain.py --runtime python
      - run: python ops/install_locked.py --editable
      - name: Download and verify the published catalog and resource bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-data
          gh release download "$SOURCE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir release-data --pattern public-data.zip
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          tag = os.environ['SOURCE_RELEASE_TAG']
          selection = json.loads(Path(f'data/releases/{tag}.json').read_text(encoding='utf-8'))
          archive = Path('release-data/public-data.zip')
          raw = archive.read_bytes()
          assert len(raw) == selection['archive']['bytes'], 'published archive size mismatch'
          assert hashlib.sha256(raw).hexdigest() == selection['archive']['sha256'], 'published archive hash mismatch'
          PY
          unzip -q release-data/public-data.zip -d release-data/public-data
      - name: Install exact selected public bytes, replay and verify the application API
        run: >-
          python ops/resource_release_acceptance.py
          --catalog release-data/public-data/catalog
          --resources release-data/public-data/resources
          --catalog-sha256 beacb31c3c12713fd818db5abbf61e9d10d7088fdc4852af4bb7fdc434595af9
          --report-sha256 34554d95fe0fa4d0a0211d1c804b9d9c187232ba0f7602b508c7cff8a7b3d3d0
          --resources-sha256 d18d05e8a7d98847dad8be3cd774591c35649193be0490f9a0c5ccaa9da76245
          --output test-results/combined-release/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-resource-release-evidence
          retention-days: 7
          path: test-results/combined-release/acceptance.json
# This repeats a pinned data acceptance case, not fresh collection or production
# deployment. Inputs come from the immutable published release and are verified
# against the selection file. Never upload temporary databases, user content or
# original raw datasets.
