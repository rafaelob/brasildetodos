name: Durable reviewed public data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-data-bundle.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: durable-reviewed-data-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'rafaelob/brasildetodos'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_TAG: public-data-20260906-v1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Verify runtime and install locked dependencies
        run: |
          python ops/check_toolchain.py --runtime python
          python ops/install_locked.py --editable
          python -m pytest backend/tests/test_public_data_bundle.py backend/tests/test_reviewed_resource_unpack.py -q
      - name: Detect an existing immutable release
        id: existing
        run: |
          mkdir -p release-data
          if gh release view "$DATA_TAG" --json tagName > /dev/null 2>&1; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.present != 'true'
        with:
          artifact-ids: '9981549978'
          run-id: '34007758949'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: input-health
      - name: Download the exact retained resource artifact, including older attempts
        if: steps.existing.outputs.present != 'true'
        run: |
          gh api repos/rafaelob/brasildetodos/actions/artifacts/9993985086/zip > "$RUNNER_TEMP/selected-resources.zip"
          python ops/unpack_reviewed_resources.py "$RUNNER_TEMP/selected-resources.zip" \
            --sha256 f37be95dad644bd784abf75895e872122cd26815192e10552a6e9c6577a94cd8 \
            --destination input-resources
      - name: Reconcile real records and publish only a bounded public package
        if: steps.existing.outputs.present != 'true'
        run: |
          python ops/public_data_bundle.py build \
            --catalog input-health/catalog --resources input-resources \
            --catalog-sha256 beacb31c3c12713fd818db5abbf61e9d10d7088fdc4852af4bb7fdc434595af9 \
            --report-sha256 34554d95fe0fa4d0a0211d1c804b9d9c187232ba0f7602b508c7cff8a7b3d3d0 \
            --resources-sha256 d18d05e8a7d98847dad8be3cd774591c35649193be0490f9a0c5ccaa9da76245 \
            --revision "$GITHUB_SHA" --output release-data/public-data.zip > release-data/verification.json
          (cd release-data && sha256sum public-data.zip > public-data.sha256)
          gh release create "$DATA_TAG" release-data/public-data.zip release-data/public-data.sha256 release-data/verification.json \
            --target "$GITHUB_SHA" --title 'Dados públicos verificados — 2026-09-06 / v1' \
            --notes-file docs/PUBLIC_DATA_RELEASE.md --prerelease --latest=false
      - name: Download published bytes and verify again without changing the release
        run: |
          mkdir -p downloaded
          gh release download "$DATA_TAG" --dir downloaded --pattern 'public-data.zip' --pattern 'public-data.sha256'
          (cd downloaded && sha256sum --check public-data.sha256)
          HASH="$(cut -d ' ' -f 1 downloaded/public-data.sha256)"
          python ops/public_data_bundle.py verify downloaded/public-data.zip --sha256 "$HASH" > release-data/published-verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('release-data/published-verification.json').read_text())
          assert result['selected_inputs']=={
              'catalog_manifest_sha256':'beacb31c3c12713fd818db5abbf61e9d10d7088fdc4852af4bb7fdc434595af9',
              'report_sha256':'34554d95fe0fa4d0a0211d1c804b9d9c187232ba0f7602b508c7cff8a7b3d3d0',
              'resources_sha256':'d18d05e8a7d98847dad8be3cd774591c35649193be0490f9a0c5ccaa9da76245'}
          assert result['counts']['places']==96123 and result['counts']['resources']==6679
          assert result['counts']['users']==0 and result['counts']['observations']==0
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-public-data-receipt
          retention-days: 90
          path: release-data/*.json
# Creates one reviewed data prerelease, never overwrites assets or mutates main.
# The package excludes staging databases, quarantine, raw records and citizen data.
# A future dataset edition requires new reviewed artifact pins and a new tag.
