name: Runtime integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - web/**
      - Dockerfile
      - compose.yaml
      - docker-compose.yml
      - pyproject.toml
      - ops/postgres-test-init.sql
      - ops/postgres_smoke.py
      - tests/runtime/test_postgres_runtime.py
      - .github/workflows/runtime-validation.yml
permissions:
  contents: read
concurrency:
  group: runtime-validation-main
  cancel-in-progress: false
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify PostgreSQL behavior through the canonical Compose profile
        run: |
          install -d -m 0777 test-results/runtime
          docker compose --profile test run --rm postgres-proof
      - name: Stop the ephemeral PostgreSQL service
        if: always()
        run: docker compose --profile test rm --stop --force postgres-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-postgres-evidence
          path: test-results/runtime/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the actual application image
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t bdt-runtime:test .
      - name: Run with a read-only filesystem and isolated temporary data
        run: |
          docker run -d --name bdt-runtime --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            --tmpfs /app/data:rw,nosuid,noexec,uid=10001,gid=10001,size=64m \
            -p 127.0.0.1:18080:8000 bdt-runtime:test
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          base='http://127.0.0.1:18080'
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(base+'/api/health',timeout=2) as response:
                      health=json.load(response)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('Container did not become healthy')
          assert health['status']=='ok' and health['llm_required'] is False
          with urllib.request.urlopen(base+'/api/config') as response:config=json.load(response)
          assert config['revision']==os.environ['GITHUB_SHA']
          assert config['registration_enabled'] is False
          with urllib.request.urlopen(base+'/api/places') as response:
              assert json.load(response)['total']==0, 'No synthetic bootstrap permitted'
          with urllib.request.urlopen(base) as response:
              html=response.read().decode()
              assert 'root' in html
              assert response.headers['X-Content-Type-Options']=='nosniff'
              assert 'frame-ancestors' in response.headers['Content-Security-Policy']
          folder=Path('test-results/runtime');folder.mkdir(parents=True,exist_ok=True)
          (folder/'container.json').write_text(json.dumps({'revision':os.environ['GITHUB_SHA'],
              'health':True,'compiled_frontend_served':True,'empty_initial_catalog':True,
              'read_only_container':True,'public_deployment':False},indent=2))
          PY
          test "$(docker exec bdt-runtime id -u)" = "10001"
          docker exec bdt-runtime python -c "import sys; assert sys.version_info[:3] == (3,14,7); print(sys.version)"
      - name: Record container result and stop it
        if: always()
        run: |
          mkdir -p test-results/runtime
          docker logs bdt-runtime > test-results/runtime/container.log 2>&1 || true
          docker rm -f bdt-runtime || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-container-evidence
          path: test-results/runtime/
          retention-days: 7
