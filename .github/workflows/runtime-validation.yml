name: Runtime integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/bdt/storage.py
      - backend/bdt/migrate.py
      - backend/tests/test_schema*.py
      - backend/tests/test_migrations.py
      - alembic.ini
      - migrations/**
      - Dockerfile
      - compose.yaml
      - compose.postgres.yaml
      - docker-compose.yml
      - docker-compose.postgres.yml
      - pyproject.toml
      - ops/postgres-test-init.sql
      - ops/postgres-local-init.sql
      - ops/postgres_smoke.py
      - tests/runtime/test_postgres_runtime.py
      - .github/workflows/runtime-validation.yml
  push:
    branches: [main]
    # Critical paths only (fleet-machine-hub#248): container/compose, schema, API/config core
    # and the dependency manifests the image installs.
    paths:
      - '**/Dockerfile*'
      - .dockerignore
      - compose.yaml
      - compose.postgres.yaml
      - docker-compose.yml
      - docker-compose.postgres.yml
      - ops/postgres-test-init.sql
      - ops/postgres-local-init.sql
      - alembic.ini
      - migrations/**
      - backend/bdt/storage.py
      - backend/bdt/migrate.py
      - backend/bdt/api.py
      - backend/bdt/features.py
      - pyproject.toml
      - requirements/**
      - .python-version
      - web/package.json
      - web/package-lock.json
      - web/.npmrc
      - .nvmrc
permissions:
  contents: read
concurrency:
  group: runtime-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify PostgreSQL behavior through the canonical Compose profile
        run: |
          install -d -m 0777 test-results/runtime
          docker compose --profile test run --rm postgres-proof
      - name: Stop the ephemeral PostgreSQL service
        if: always()
        run: docker compose --profile test rm --stop --force postgres-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-postgres-evidence
          path: test-results/runtime/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the actual application image
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t bdt-runtime:test .
      - name: Run with a read-only filesystem and isolated temporary data
        run: |
          docker run -d --name bdt-runtime --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            --tmpfs /app/data:rw,nosuid,noexec,uid=10001,gid=10001,size=64m \
            -p 127.0.0.1:18080:8000 bdt-runtime:test
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          base='http://127.0.0.1:18080'
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(base+'/api/health',timeout=2) as response:
                      health=json.load(response)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('Container did not become healthy')
          assert health['status']=='ok' and health['llm_required'] is False
          with urllib.request.urlopen(base+'/api/config') as response:config=json.load(response)
          assert config['revision']==os.environ['GITHUB_SHA']
          assert config['registration_enabled'] is False
          with urllib.request.urlopen(base+'/api/places') as response:
              assert json.load(response)['total']==0, 'No synthetic bootstrap permitted'
          with urllib.request.urlopen(base) as response:
              html=response.read().decode()
              assert 'root' in html
              assert response.headers['X-Content-Type-Options']=='nosniff'
              assert 'frame-ancestors' in response.headers['Content-Security-Policy']
          folder=Path('test-results/runtime');folder.mkdir(parents=True,exist_ok=True)
          (folder/'container.json').write_text(json.dumps({'revision':os.environ['GITHUB_SHA'],
              'health':True,'compiled_frontend_served':True,'empty_initial_catalog':True,
              'read_only_container':True,'public_deployment':False},indent=2))
          PY
          test "$(docker exec bdt-runtime id -u)" = "10001"
          docker exec bdt-runtime python -c "import sys; assert sys.version_info[:3] == (3,14,8); print(sys.version)"
      - name: Record container result and stop it
        if: always()
        run: |
          mkdir -p test-results/runtime
          docker logs bdt-runtime > test-results/runtime/container.log 2>&1 || true
          docker rm -f bdt-runtime || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-container-evidence
          path: test-results/runtime/
          retention-days: 7
  postgres-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start the durable local PostgreSQL stack
        run: docker compose -f compose.postgres.yaml up --build -d
      - name: Verify migration, health, backup and restore
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8009/api/health > health.json; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json
          health=json.load(open('health.json'))
          assert health['status']=='ok' and health['llm_required'] is False
          PY
          docker compose -f compose.postgres.yaml exec -T postgres \
            psql -U bdt_app -d bdt_app -c "select version_num from alembic_version" \
            | grep -q 0003_parceria_empenhos
          docker compose -f compose.postgres.yaml --profile ops run --rm \
            -e BDT_BACKUP_NAME=bdt-ci.dump postgres-backup
          docker compose -f compose.postgres.yaml --profile ops run --rm \
            -e BDT_RESTORE_BACKUP=bdt-ci.dump -e BDT_RESTORE_DB=bdt_restore_ci \
            postgres-restore > restore.log
          grep -q 0003_parceria_empenhos restore.log
      - name: Clean the local stack and its volumes
        if: always()
        run: docker compose -f compose.postgres.yaml down -v --remove-orphans
